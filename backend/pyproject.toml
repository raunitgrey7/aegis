[project]
name = "aegis"
version = "0.1.0"
description = "Aegis — AI-powered cybersecurity investigation & threat intelligence platform"
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Raunit Thakur" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "aiosqlite>=0.20",
  "networkx>=3.3",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "redis>=5.0",
  "prometheus-client>=0.20",
  "numpy>=1.26",
  "structlog>=24.1",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1", "pgvector>=0.3"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
aegis-api = "aegis.main:run"
aegis-worker = "aegis.ingestion.worker:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["aegis*"]

[tool.setuptools.package-data]
aegis = ["rules/**/*.yaml", "data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI's Depends()/Query() in argument defaults is the framework's intended idiom.
# E501: data-heavy modules (rule packs, scenario builders) carry long literal lines by design.
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["E731", "F841"]
"**/scenarios.py" = ["E731", "B007"]
